# 每次合併到 main,自動測試、打包、發布到 GitHub Pages(docs/architecture.md 第 12 節)。
# 一次性設定:repo 的 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 測試沒過就停止,不發布
      - run: npm test
      - run: npm run build
        env:
          # 階段二:接真實的 Supabase。網址與 Publishable key(可公開)放在 repo 的
          # Settings → Secrets and variables → Actions → Variables:VITE_SUPABASE_URL、VITE_SUPABASE_PUBLISHABLE_KEY
          # 要退回模擬版:把下一行改成 mock
          VITE_BACKEND: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
